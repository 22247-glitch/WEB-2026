<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Signup.css">
  <title>Addictionlingo</title>
</head>
<body>
  <div class="content-wrapper">
    <h1 class="top">Welcome to AddictionLingo!</h1>
  </div>
  
  <div class="content-wrapper">
    <form id="RegisterForm" name="RegisterForm" method="post" action="" enctype="multipart/form-data">
        <div class="login">
      <h1 class="center">Signup to AddictionLingo:</h1>
      <!-- text field-->
      <div class="inputs">
        <label><b>Username</b></label>
        <input input name="Username" type="text" required="required" placeholder="Enter Username">
      </div>
      <!-- text field-->
      <div class="inputs">
        <label><b>Password</b></label>
        <input input name="Password" type="text" required="required" placeholder="Enter Password">
      </div>
      <!-- button-->
      <div class="inputs">
        <input name="SignUp" type="submit" class="button" id="SignUp" value="SignUp">
      </div>
      
    </form>
    

  </div> 

</body>
</html>
